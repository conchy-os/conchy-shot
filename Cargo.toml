[package]
name = "conchy-shot"
version = "0.1.0"
edition = "2021"
description = "Modern Wayland screenshot and annotation tool with unified multi-monitor canvas, written in pure Rust for Conchy OS"
readme = "README.md"
homepage = "https://github.com/conchy-os/conchy-shot"
repository = "https://github.com/conchy-os/conchy-shot"
license = "GPL-3.0-or-later"
keywords = ["wayland", "screenshot", "wlroots", "annotation", "conchy"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "conchy-shot"
path = "src/main.rs"

[lib]
name = "conchy_shot"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
bytemuck = { version = "1.24.0", features = ["derive"] }
cairo-rs = "0.21.2"
chrono = { version = "0.4.42", default-features = false, features = ["clock"] }
clap = { version = "4.5.60", features = ["derive"] }
directories = "6.0.0"
image = "0.25.8"
kdl = "4.6"
libwayshot = "0.7.3"
notify-rust = { version = "4.11.7", default-features = false, features = ["d"] }
pango = { version = "0.21.3", features = ["v1_44"] }
pangocairo = "0.21.2"
pollster = "0.4.0"
raw-window-handle = "0.6.2"
serde = { version = "1.0.228", features = ["derive"] }
smithay-client-toolkit = "0.20.0"
toml = "0.9.8"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
wayland-client = "0.31.11"
wgpu = "29.0.0"
wl-clipboard-rs = "0.9.3"
xkeysym = "0.2.1"
